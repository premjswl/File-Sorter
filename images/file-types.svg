<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Where each file type goes</text>

  <g font-size="13">
    <!-- Row 1 -->
    <rect x="20" y="55" width="170" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">📁 Photos</text>
    <text x="105" y="110" text-anchor="middle" fill="#1f2937">.jpg .jpeg .png</text>
    <text x="105" y="130" text-anchor="middle" fill="#1f2937">.gif .webp .bmp</text>
    <text x="105" y="150" text-anchor="middle" fill="#1f2937">.heic .svg</text>

    <rect x="205" y="55" width="170" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="290" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">📁 Docs</text>
    <text x="290" y="110" text-anchor="middle" fill="#1f2937">.pdf .docx .doc</text>
    <text x="290" y="130" text-anchor="middle" fill="#1f2937">.txt .rtf</text>
    <text x="290" y="150" text-anchor="middle" fill="#1f2937">.odt .md</text>

    <rect x="390" y="55" width="170" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="475" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">📁 Spreadsheets</text>
    <text x="475" y="115" text-anchor="middle" fill="#1f2937">.xlsx .xls .csv</text>

    <rect x="575" y="55" width="165" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="657" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">📁 Presentations</text>
    <text x="657" y="115" text-anchor="middle" fill="#1f2937">.pptx .ppt .key</text>

    <!-- Row 2 -->
    <rect x="20" y="195" width="170" height="120" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="105" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b21a8">📁 Music</text>
    <text x="105" y="255" text-anchor="middle" fill="#1f2937">.mp3 .wav</text>
    <text x="105" y="275" text-anchor="middle" fill="#1f2937">.flac .m4a</text>

    <rect x="205" y="195" width="170" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="290" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">📁 Videos</text>
    <text x="290" y="255" text-anchor="middle" fill="#1f2937">.mp4 .mov</text>
    <text x="290" y="275" text-anchor="middle" fill="#1f2937">.mkv .avi</text>

    <rect x="390" y="195" width="170" height="120" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="475" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#155e75">📁 Zipped_Files</text>
    <text x="475" y="255" text-anchor="middle" fill="#1f2937">.zip .rar .7z</text>
    <text x="475" y="275" text-anchor="middle" fill="#1f2937">.tar .gz</text>

    <rect x="575" y="195" width="165" height="120" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="657" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">📁 Installers</text>
    <text x="657" y="255" text-anchor="middle" fill="#1f2937">.exe .msi</text>
    <text x="657" y="275" text-anchor="middle" fill="#1f2937">.dmg .pkg</text>
  </g>

  <text x="380" y="342" text-anchor="middle" font-size="12" fill="#6b7280">Shortcuts (.lnk), hidden files and anything not listed are left untouched.</text>
</svg>
