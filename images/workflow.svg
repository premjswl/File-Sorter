<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">How it works</text>

  <!-- Step 1 -->
  <rect x="20" y="60" width="160" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="45" cy="85" r="14" fill="#2563eb"/><text x="45" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="100" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Preview</text>
  <text x="100" y="118" text-anchor="middle" font-size="12" fill="#1f2937">Run the sorter with</text>
  <text x="100" y="136" text-anchor="middle" font-size="12" fill="#1f2937" font-family="Consolas, monospace">DRY_RUN = True</text>
  <text x="100" y="156" text-anchor="middle" font-size="12" fill="#1f2937">Nothing is moved</text>

  <!-- Step 2 -->
  <rect x="210" y="60" width="160" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="235" cy="85" r="14" fill="#16a34a"/><text x="235" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="290" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Sort</text>
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="#1f2937">Set</text>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#1f2937" font-family="Consolas, monospace">DRY_RUN = False</text>
  <text x="290" y="156" text-anchor="middle" font-size="12" fill="#1f2937">Files move to folders</text>

  <!-- Step 3 -->
  <rect x="400" y="60" width="160" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="425" cy="85" r="14" fill="#d97706"/><text x="425" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="485" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Log saved</text>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#1f2937">Every move recorded in</text>
  <text x="480" y="136" text-anchor="middle" font-size="12" fill="#1f2937" font-family="Consolas, monospace">file_sort_logs/</text>
  <text x="480" y="156" text-anchor="middle" font-size="12" fill="#1f2937">(your undo history)</text>

  <!-- Step 4 -->
  <rect x="590" y="60" width="150" height="110" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <circle cx="615" cy="85" r="14" fill="#9333ea"/><text x="615" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="680" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b21a8">Restore</text>
  <text x="665" y="118" text-anchor="middle" font-size="12" fill="#1f2937">Run restore script to</text>
  <text x="665" y="136" text-anchor="middle" font-size="12" fill="#1f2937">put files back exactly</text>
  <text x="665" y="156" text-anchor="middle" font-size="12" fill="#1f2937">where they were</text>

  <!-- Arrows -->
  <g fill="#6b7280" stroke="#6b7280" stroke-width="3">
    <path d="M182 115 H198" fill="none"/><path d="M198 108 L208 115 L198 122 Z" stroke="none"/>
    <path d="M372 115 H388" fill="none"/><path d="M388 108 L398 115 L388 122 Z" stroke="none"/>
    <path d="M562 115 H578" fill="none"/><path d="M578 108 L588 115 L578 122 Z" stroke="none"/>
  </g>

  <!-- Tip bar -->
  <rect x="20" y="200" width="720" height="70" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="40" y="228" font-size="14" font-weight="bold" fill="#1f2937">Tip</text>
  <text x="40" y="250" font-size="13" fill="#374151">Always do step 1 first. The preview shows exactly which files would move, so there are no surprises.</text>
</svg>
